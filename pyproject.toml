[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aka_claude"
version = "0.1.9"
description = "Python implementation of Claude Code - an agentic coding assistant in your terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Claude Code Py" },
]
keywords = ["claude", "ai", "coding", "assistant", "cli", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pygments>=2.17.0",
    "chardet>=5.0.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35.0"]
gcp = ["google-cloud-aiplatform>=1.70.0"]
azure = ["azure-ai-inference>=1.0.0b9"]
mcp = ["mcp>=1.0.0"]
all = [
    "boto3>=1.35.0",
    "google-cloud-aiplatform>=1.70.0",
    "azure-ai-inference>=1.0.0b9",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
aka = "claude_code.cli:main"

[project.urls]
Homepage = "https://github.com/anthropics/claude-code"
Documentation = "https://code.claude.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code"]

[tool.hatch.build.targets.sdist]
# Whitelist source-dist contents so local dirs (env/, dist/, caches) are
# never packaged.
include = [
    "/src",
    "/main.py",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
